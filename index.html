<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゴリラ遊動シミュレーション</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="container">
    <h1>Gorilla Optimal Foraging Strategy Puzzle</h1>

    <div id="controls">
      <button id="start-button">Start Game</button>
      <button id="stop-button" style="display: none;">Stop Game</button>
      <button id="how-to-play-button" onclick="window.open('how-to-play.html', 'HowToPlay', 'width=600,height=400');">How to Play (JP) </button>
      <button onclick="window.open('how-to-play-en.html', 'HowToPlayEN', 'width=600,height=400');">How to Play (En)</button>
    </div>

    <div id="info">
      <span id="point">Score: 0</span> |
      <span id="max-score">Max Score: 0</span> |
      <span id="score-board">Food intake: 0</span> |
      <span id="travel-cost">Travel cost: 0</span> |
    </div>

    <div id="timer">Time: 90s</div>
    <div id="message"></div>
    <div id="grid" class="disabled"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
